version: '3.8'

services:
  postgres:
    image: docker.1ms.run/postgres:17-alpine
    environment:
      - POSTGRES_USER=docfusion
      - POSTGRES_PASSWORD=docfusion123
      - POSTGRES_DB=docfusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  neo4j:
    image: docker.1ms.run/neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
      - "6336:6336"

  onlyoffice:
    image: docker.1ms.run/onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  onlyoffice_data:
