version: '3.8'

services:
  onlyoffice:
    image: documentserver-develop:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - JWT_ENABLED=false
      - SECURE_LINK_SECRET=yQYi0yzvGKxkIs8tfLaL
      - ALLOW_PRIVATE_IP_ADDRESS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint: ["/bin/sh", "-c", "rm -rf /var/www/onlyoffice/documentserver/fonts && mkdir -p /var/www/onlyoffice/documentserver/fonts && chmod 777 /var/www/onlyoffice/documentserver/fonts && rm -f /var/www/onlyoffice/documentserver/server/FileConverter/bin/font_selection.bin /var/www/onlyoffice/documentserver/server/FileConverter/bin/AllFonts.js && find /var/www/onlyoffice/documentserver/core-fonts -name '*.ttc' -delete && python3 /var/www/onlyoffice/documentserver/build_tools/develop/run_build_js.py /var/www/onlyoffice/documentserver $$@ && DS=/var/www/onlyoffice/documentserver/sdkjs && for d in word cell slide visio; do ln -sf $$DS/deploy/sdkjs/$$d/sdk-all-min.js $$DS/$$d/sdk-all-min.js 2>/dev/null; ln -sf $$DS/deploy/sdkjs/$$d/sdk-all.js $$DS/$$d/sdk-all.js 2>/dev/null; ln -sf $$DS/deploy/sdkjs/$$d/sdk-all.cache $$DS/$$d/sdk-all.cache 2>/dev/null; done && exec /bin/sh -c /app/ds/run-document-server.sh"]
    volumes:
      # 官方流程：挂载源码
      - /home/qilin/onlyoffice/sdkjs:/var/www/onlyoffice/documentserver/sdkjs
      - /home/qilin/onlyoffice/web-apps:/var/www/onlyoffice/documentserver/web-apps
      - /home/qilin/onlyoffice/server:/var/www/onlyoffice/documentserver/server
      # 保留原有配置
      - ./onlyoffice/local.json:/etc/onlyoffice/documentserver/local.json:ro
      - ./onlyoffice/ds.conf:/etc/onlyoffice/documentserver/nginx/ds.conf:ro
      - ./onlyoffice/ds-docservice.conf:/etc/nginx/includes/ds-docservice.conf:ro
      # 数据持久化
      - onlyoffice_data:/var/www/onlyoffice/Data
    networks:
      - dev-net

  postgres:
    image: docker.1ms.run/postgres:17-alpine
    environment:
      - POSTGRES_USER=docfusion
      - POSTGRES_PASSWORD=docfusion123
      - POSTGRES_DB=docfusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dev-net

  neo4j:
    image: docker.1ms.run/neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - dev-net

  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
      - "6336:6336"
    networks:
      - dev-net

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  onlyoffice_data:

networks:
  dev-net:
    driver: bridge
