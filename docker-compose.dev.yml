version: '3.8'

services:
  postgres:
    image: docker.1ms.run/postgres:17-alpine
    environment:
      - POSTGRES_USER=docfusion
      - POSTGRES_PASSWORD=docfusion123
      - POSTGRES_DB=docfusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - dev-net

  neo4j:
    image: docker.1ms.run/neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"
    networks:
      - dev-net

  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
      - "6336:6336"
    networks:
      - dev-net

  onlyoffice:
    image: docker.1ms.run/onlyoffice/documentserver:latest
    restart: unless-stopped
    ports:
      - "8088:80"
    environment:
      - JWT_ENABLED=false
      - SECURE_LINK_SECRET=yQYi0yzvGKxkIs8tfLaL
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - ./onlyoffice/local.json:/etc/onlyoffice/documentserver/local.json:ro
      - ./onlyoffice/ds.conf:/etc/onlyoffice/documentserver/nginx/ds.conf:ro
      - ./onlyoffice/ds-docservice.conf:/etc/nginx/includes/ds-docservice.conf:ro
    networks:
      - dev-net

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  onlyoffice_data:

networks:
  dev-net:
    driver: bridge
