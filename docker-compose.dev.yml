
services:
  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=docfusion
      - POSTGRES_PASSWORD=docfusion123
      - POSTGRES_DB=docfusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/neo4j123
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
    ports:
      - "7474:7474"
      - "7687:7687"

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
      - "6336:6336"

  onlyoffice:
    image: onlyoffice/documentserver:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:80"
    environment:
      - JWT_ENABLED=false
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - ./onlyoffice/local.json:/etc/onlyoffice/documentserver/local.json:ro
      - ./onlyoffice/ds.conf:/etc/onlyoffice/documentserver/nginx/ds.conf:ro
      - ./onlyoffice/ds-docservice.conf:/etc/nginx/includes/ds-docservice.conf:ro

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  onlyoffice_data:
