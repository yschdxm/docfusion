version: '3.8'

services:
  onlyoffice:
    image: onlyoffice/documentserver:8.3
    container_name: docfusion-onlyoffice
    restart: unless-stopped
    environment:
      - JWT_ENABLED=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8088:80"
    volumes:
      # - ./onlyoffice-local.json:/etc/onlyoffice/documentserver/local.json:ro
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

volumes:
  onlyoffice_data:
  onlyoffice_logs:
