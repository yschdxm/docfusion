server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # File upload size limit (50MB)
    client_max_body_size 50M;

    # Docker 内嵌 DNS：onlyoffice 等容器重启后 IP 会漂移，
    # 静态 proxy_pass http://onlyoffice:80 只在配置加载时解析一次并永久缓存，
    # 必须用变量形式 proxy_pass 才能按 resolver TTL 动态重新解析
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API 路由 - 使用 ^~ 确保最高优先级匹配
    location ^~ /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket 支持（Agent 流式对话需要）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # LLM 长请求超时（Agent任务可能需要较长时间，保持连接活跃）
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 上传文件路由
    location ^~ /uploads {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ONLYOFFICE Document Server - 带版本号前缀的路径
    # ONLYOFFICE 会将请求重定向到 /<version-hash>/... 格式
    # 包括 web-apps、sdk、doc（WebSocket）等所有子路径
    location ~ ^/[a-zA-Z0-9._-]+-[a-f0-9]+/ {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ONLYOFFICE Document Server - 无版本号的路径
    location ^~ /web-apps {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /sdk {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /info {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /cache {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /coauthoring {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /command {
        set $onlyoffice_upstream http://onlyoffice:80;
        proxy_pass $onlyoffice_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 前端静态文件
    location / {
        try_files $uri $uri/ /index.html;
    }
}
