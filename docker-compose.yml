version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docfusion-backend:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    environment:
      # 数据库配置（使用环境变量）
      - POSTGRES_URL=postgresql://docfusion:${POSTGRES_PASSWORD:-docfusion123}@postgres:5432/docfusion
      - MONGODB_URL=mongodb://mongo:27017/docfusion
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:-neo4j123}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # API 配置（使用环境变量或默认值）
      - MIMO_API_KEY=${MIMO_API_KEY}
      - GITEE_AI_API_KEY=${GITEE_AI_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      - MIMO_MODEL=${MIMO_MODEL:-mimo-v2-flash}
      - GITEE_AI_BASE_URL=${GITEE_AI_BASE_URL:-https://ai.gitee.com/v1}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-bge-m3}
      - RERANK_MODEL=${RERANK_MODEL:-bge-reranker-v2-m3}
      # LLM 流控配置
      - LLM_RPM=${LLM_RPM:-100}
      - LLM_TPM=${LLM_TPM:-10000000}
      # SSL 配置
      - SSL_VERIFY=${SSL_VERIFY:-true}
      - SSL_VERIFY_MIMO=${SSL_VERIFY_MIMO:-true}
      - SSL_VERIFY_GITEE_AI=${SSL_VERIFY_GITEE_AI:-true}
      # 应用配置（生产环境关闭 DEBUG）
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY:-docfusion-secret-key-2024}
      # 日志级别配置
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_LEVEL_DB=${LOG_LEVEL_DB:-WARNING}
      - LOG_LEVEL_SERVICE=${LOG_LEVEL_SERVICE:-INFO}
      - LOG_LEVEL_API=${LOG_LEVEL_API:-INFO}
      - LOG_LEVEL_LLM=${LOG_LEVEL_LLM:-INFO}
      - LOG_LEVEL_KG=${LOG_LEVEL_KG:-INFO}
      - LOG_LEVEL_RAG=${LOG_LEVEL_RAG:-INFO}
      - LOG_LEVEL_UVICORN=${LOG_LEVEL_UVICORN:-WARNING}
      - LOG_LEVEL_SQLALCHEMY=${LOG_LEVEL_SQLALCHEMY:-WARNING}
      - LOG_LEVEL_NEO4J_DRIVER=${LOG_LEVEL_NEO4J_DRIVER:-WARNING}
      - LOG_LEVEL_MOTOR=${LOG_LEVEL_MOTOR:-WARNING}
      - LOG_LEVEL_REDIS=${LOG_LEVEL_REDIS:-WARNING}
      - LOG_LEVEL_CELERY=${LOG_LEVEL_CELERY:-WARNING}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: docfusion-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - docfusion-net

  postgres:
    image: docker.1ms.run/postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=docfusion
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-docfusion123}
      - POSTGRES_DB=docfusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: docker.1ms.run/mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    expose:
      - "27017"
    networks:
      - docfusion-net

  neo4j:
    image: docker.1ms.run/neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j123}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    expose:
      - "7474"
      - "7687"
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: docker.1ms.run/redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    expose:
      - "6379"
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    networks:
      - docfusion-net

volumes:
  uploads:
  postgres_data:
  mongo_data:
  neo4j_data:
  redis_data:
  qdrant_data:

networks:
  docfusion-net:
    driver: bridge
