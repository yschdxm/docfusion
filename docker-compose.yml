version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: docfusion-backend:latest
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - uploads:/app/uploads
    environment:
      # 数据库配置
      - POSTGRES_URL=postgresql://docfusion:${POSTGRES_PASSWORD}@postgres:5432/docfusion
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - QDRANT_URL=http://qdrant:6333
      # API 配置
      - MIMO_API_KEY=${MIMO_API_KEY}
      - GITEE_AI_API_KEY=${GITEE_AI_API_KEY}
      - MIMO_BASE_URL=${MIMO_BASE_URL}
      - MIMO_MODEL=${MIMO_MODEL}
      - GITEE_AI_BASE_URL=${GITEE_AI_BASE_URL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL}
      - RERANK_MODEL=${RERANK_MODEL}
      # LLM 流控配置
      - LLM_RPM=${LLM_RPM}
      - LLM_TPM=${LLM_TPM}
      # SSL 配置
      - SSL_VERIFY=${SSL_VERIFY}
      - SSL_VERIFY_MIMO=${SSL_VERIFY_MIMO}
      - SSL_VERIFY_GITEE_AI=${SSL_VERIFY_GITEE_AI}
      # 应用配置
      - DEBUG=${DEBUG}
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      # ONLYOFFICE 配置
      - ONLYOFFICE_ENABLED=true
      - ONLYOFFICE_SERVER_URL=http://onlyoffice:80
      - ONLYOFFICE_DOCUMENT_SERVER_URL=http://onlyoffice:80
      - ONLYOFFICE_CALLBACK_BASE_URL=http://backend:8000
      - ONLYOFFICE_API_PREFIX=/api/v1
      - BACKEND_PUBLIC_URL=http://backend:8000
      # 日志级别配置
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_LEVEL_DB=${LOG_LEVEL_DB}
      - LOG_LEVEL_SERVICE=${LOG_LEVEL_SERVICE}
      - LOG_LEVEL_API=${LOG_LEVEL_API}
      - LOG_LEVEL_LLM=${LOG_LEVEL_LLM}
      - LOG_LEVEL_KG=${LOG_LEVEL_KG}
      - LOG_LEVEL_RAG=${LOG_LEVEL_RAG}
      - LOG_LEVEL_UVICORN=${LOG_LEVEL_UVICORN}
      - LOG_LEVEL_SQLALCHEMY=${LOG_LEVEL_SQLALCHEMY}
      - LOG_LEVEL_NEO4J_DRIVER=${LOG_LEVEL_NEO4J_DRIVER}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: docfusion-frontend:latest
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - docfusion-net

  postgres:
    image: docker.1ms.run/postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=docfusion
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=docfusion
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: docker.1ms.run/neo4j:5
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
    expose:
      - "7474"
      - "7687"
    networks:
      - docfusion-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: docker.1ms.run/qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    expose:
      - "6333"
    networks:
      - docfusion-net

  onlyoffice:
    image: docker.1ms.run/onlyoffice/documentserver:latest
    restart: unless-stopped
    expose:
      - "8088"
    ports:
      - "8088:80"
    environment:
      - JWT_ENABLED=false
      - SECURE_LINK_SECRET=yQYi0yzvGKxkIs8tfLaL
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - ./onlyoffice/local.json:/etc/onlyoffice/documentserver/local.json:ro
      - ./onlyoffice/ds.conf:/etc/onlyoffice/documentserver/nginx/ds.conf:ro
    networks:
      - docfusion-net

volumes:
  uploads:
  postgres_data:
  neo4j_data:
  qdrant_data:
  onlyoffice_data:

networks:
  docfusion-net:
    driver: bridge
